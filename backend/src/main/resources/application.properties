# Database Configuration - PostgreSQL for production, H2 for development
spring.profiles.active=dev

# Development Profile (H2)
spring.datasource.url=jdbc:h2:mem:opsflow
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Server Configuration
server.port=8081

# JWT Configuration
app.jwt.secret=OpsFlow2024SecretKeyForJWTTokenGenerationAndValidation
app.jwt.expiration=86400000

# Email Configuration (disabled in development)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application Configuration
app.base-url=http://localhost:3000
app.admin.email=admin@opsflow.com
app.email.enabled=false
